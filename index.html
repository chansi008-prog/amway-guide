<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맞춤 제품 가이드</title>
<meta name="theme-color" content="#2f6b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="제품가이드">
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1d2320; --muted: #6b726e; --line: #e4e2dc;
    --accent: #2f6b4f; --accent-soft: #e5f0ea; --warn: #9a5b13; --chip: #efede7; --dose-bg: #fbf3e4; --dose-ink: #8a5a12;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151816; --card: #1e2220; --ink: #ecefec; --muted: #9aa29d; --line: #2e3431;
      --accent: #6fbf95; --accent-soft: #24352c; --warn: #e0a85c; --chip: #262b28; --dose-bg: #2c2619; --dose-ink: #e0b46c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    font-size: 15px; line-height: 1.5; padding-bottom: 90px; }
  header { padding: 20px 16px 8px; max-width: 880px; margin: 0 auto; }
  header h1 { font-size: 22px; margin: 0; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  main { max-width: 880px; margin: 0 auto; padding: 0 16px; }
  .tabs { display: flex; gap: 6px; margin: 12px 0; }
  .tabs button { flex: 1; padding: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  section.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .panel h2 { font-size: 16px; margin: 0 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 140px; flex: 1; }
  .field > span, .grp-title { font-size: 13px; color: var(--muted); font-weight: 600; }
  input[type=number], input[type=search], select { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--ink); font-size: 15px; width: 100%; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 7px 12px; border-radius: 999px; background: var(--chip); border: 1px solid transparent;
    color: var(--ink); font-size: 14px; cursor: pointer; user-select: none; }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .grp { margin-bottom: 12px; }
  .grp-title { margin-bottom: 6px; display: block; }
  .actions { display: flex; gap: 8px; }
  .btn { padding: 11px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; flex: 1; }
  .result-head { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 2px 10px; }
  .result-head h2 { font-size: 16px; margin: 0; }
  .result-head span { color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .card .meta { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .card h3 { font-size: 16px; margin: 0; line-height: 1.35; }
  .card .desc { font-size: 13px; color: var(--muted); margin: 0; }
  .card .price { font-size: 18px; font-weight: 700; }
  .card .size { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .card .monthly { font-size: 12px; color: var(--warn); }
  .card select { padding: 6px 8px; font-size: 13px; }
  .why { display: flex; flex-wrap: wrap; gap: 4px; }
  .why span { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .card .pick { margin-top: auto; padding: 9px; border-radius: 10px; border: 1px solid var(--accent); background: transparent;
    color: var(--accent); font-weight: 600; font-size: 14px; cursor: pointer; }
  .card.sel .pick { background: var(--accent); color: #fff; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .filters input { flex: 2; min-width: 180px; }
  .filters select { flex: 1; min-width: 120px; width: auto; }
  .dose { background: var(--dose-bg); border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.45; }
  .dose b { display: block; font-size: 12px; color: var(--dose-ink); margin-bottom: 1px; }
  .dose .days { display: block; margin-top: 3px; font-size: 12px; color: var(--muted); }
  .dose-list { display: flex; flex-direction: column; gap: 8px; }
  .dose-row { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .dose-row .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .dose-row .top b { font-size: 15px; }
  .dose-row .top span { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .dose-row .how { font-size: 14px; margin-top: 4px; }
  .dose-row .days { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .note { font-size: 12px; color: var(--muted); margin: 18px 2px; }

  /* 선택 목록 */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); z-index: 10; }
  .bar-inner { max-width: 880px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .bar-inner .sum { flex: 1; font-size: 14px; }
  .bar-inner .sum b { font-size: 17px; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 82vh; overflow: auto; background: var(--card);
    border-radius: 18px 18px 0 0; z-index: 21; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .25s; }
  .sheet.open { transform: none; }
  .sheet-inner { max-width: 880px; margin: 0 auto; }
  .sheet h2 { margin: 0 0 10px; font-size: 18px; display: flex; justify-content: space-between; }
  .line { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .line .nm { flex: 1; font-size: 14px; }
  .line .nm small { display: block; color: var(--muted); }
  .qty { display: flex; align-items: center; gap: 6px; }
  .qty button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
  .line .lp { width: 92px; text-align: right; font-weight: 600; font-size: 14px; }
  .total { display: flex; justify-content: space-between; font-size: 17px; font-weight: 700; padding: 14px 0; }
  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; z-index: 30; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>맞춤 제품 가이드</h1>
  <p>암웨이 카탈로그 「The Choice」 Autumn 2026 Vol.75 기준</p>
</header>

<main>
  <div class="tabs">
    <button id="tabRec" class="on">추천 받기</button>
    <button id="tabAll">전체 제품</button>
    <button id="tabDose">섭취 방법</button>
  </div>

  <!-- 추천 받기 -->
  <div id="viewRec">
    <section class="panel">
      <h2>소비자 정보</h2>
      <div class="row">
        <label class="field"><span>나이</span><input id="age" type="number" min="0" max="110" placeholder="예: 45" inputmode="numeric"></label>
        <div class="field"><span>성별</span>
          <div class="chips" id="gender">
            <span class="chip" data-v="F">여성</span><span class="chip" data-v="M">남성</span>
          </div>
        </div>
        <label class="field"><span>예산 (1개당 최대)</span>
          <select id="budget">
            <option value="">제한 없음</option>
            <option value="30000">3만 원 이하</option>
            <option value="50000">5만 원 이하</option>
            <option value="100000">10만 원 이하</option>
            <option value="300000">30만 원 이하</option>
            <option value="1000000">100만 원 이하</option>
          </select>
        </label>
      </div>
      <div class="grp">
        <span class="grp-title">관심 분야 (선택 안 하면 전체)</span>
        <div class="chips" id="cats"></div>
      </div>
    </section>

    <section class="panel">
      <h2>고민·증상</h2>
      <div id="concerns"></div>
      <div class="actions">
        <button class="btn" id="reset">초기화</button>
        <button class="btn primary" id="go">추천 보기</button>
      </div>
    </section>

    <div id="recOut"></div>
  </div>

  <!-- 전체 제품 -->
  <div id="viewAll" hidden>
    <div class="filters">
      <input id="q" type="search" placeholder="제품명 검색 (예: 오메가, 샴푸)">
      <select id="fCat"><option value="">전체 카테고리</option></select>
      <select id="fSort">
        <option value="pg">카탈로그 순</option>
        <option value="low">낮은 가격순</option>
        <option value="high">높은 가격순</option>
      </select>
    </div>
    <div class="result-head"><h2>전체 제품</h2><span id="allCount"></span></div>
    <div class="grid" id="allGrid"></div>
  </div>

  <!-- 섭취 방법 모아보기 -->
  <div id="viewDose" hidden>
    <div class="filters"><input id="dq" type="search" placeholder="영양제 이름 검색 (예: 비타민, 오메가)"></div>
    <div class="result-head"><h2>💊 영양제 섭취 방법</h2><span id="doseCount"></span></div>
    <div class="dose-list" id="doseList"></div>
  </div>

  <p class="note">※ 가격은 카탈로그 게재 기준 소비자가이며 변동될 수 있습니다. 건강기능식품은 질병의 예방·치료를 위한 의약품이 아닙니다. 복용 중인 약이 있거나 임신 중이라면 전문가와 상담하세요.</p>
</main>

<div class="bar">
  <div class="bar-inner">
    <div class="sum">선택 <b id="barCount">0</b>개 · <b id="barTotal">0원</b></div>
    <button class="btn primary" id="openSheet" style="flex:none">선택 목록 보기</button>
  </div>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="sheet-inner">
    <h2>선택 목록 <button class="btn" id="closeSheet" style="padding:4px 12px">닫기</button></h2>
    <div id="lines"></div>
    <div class="total"><span>합계</span><span id="sheetTotal">0원</span></div>
    <div class="actions">
      <button class="btn" id="clearSel">비우기</button>
      <button class="btn primary" id="copySel">안내 문구 복사</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// 암웨이 카탈로그 「The Choice」 Autumn 2026 Vol.75 기준 (pg = 카탈로그 인쇄 페이지)
// 필드: n 이름, c 카테고리, s 세부분류, z 용량, p 가격(원), pg 페이지, t 관심사 태그,
//       a [최소나이, 최대나이], g 'F'|'M' 성별 한정, d 한 줄 소개, v 다른 용량 [{z,p}], m 월 렌탈/할부 안내

const CATEGORIES = {
  nutrition: { label: '영양 건강', icon: '💊' },
  beauty:    { label: '뷰티', icon: '✨' },
  personal:  { label: '퍼스널 케어', icon: '🧴' },
  home:      { label: '홈 리빙', icon: '🧺' },
  hometech:  { label: '홈테크', icon: '🏠' },
};

const CONCERNS = [
  { group: '건강', items: [
    ['basic', '기초 영양'], ['fatigue', '피로·활력'], ['immune', '면역력'], ['gut', '장 건강'],
    ['digest', '소화'], ['bone', '뼈·치아'], ['joint', '관절·근력'], ['eye', '눈 건강'],
    ['blood', '혈행·콜레스테롤'], ['brain', '기억력·두뇌'], ['liver', '간 건강'], ['sugar', '혈당'],
    ['sleep', '수면·스트레스'], ['weight', '체중·체지방'], ['protein', '단백질 보충'], ['antiox', '항산화'],
    ['skinin', '피부 이너뷰티'], ['meno', '갱년기'], ['prostate', '전립선'], ['growth', '성장기'],
    ['preg', '임신·수유'], ['anemia', '철분 부족'], ['nose', '비염·코 건강'],
  ]},
  { group: '피부·뷰티', items: [
    ['wrinkle', '주름·탄력'], ['bright', '미백·잡티'], ['dry', '건조·보습'], ['oily', '지성·트러블'],
    ['sensitive', '민감·진정'], ['pore', '모공·각질'], ['sun', '자외선'], ['makeup', '메이크업 클렌징'],
  ]},
  { group: '헤어·바디·구강', items: [
    ['hairloss', '탈모·두피'], ['damaged', '손상모'], ['dandruff', '비듬·지성 두피'], ['oral', '구강·잇몸'],
    ['bodydry', '바디 건조·가려움'], ['baby', '아기 피부'],
  ]},
  { group: '생활·홈', items: [
    ['dust', '미세먼지·공기'], ['water', '깨끗한 물'], ['humid', '건조한 실내'], ['cook', '건강한 요리'],
    ['exercise', '운동 부족'], ['massage', '발·다리 피로'], ['laundry', '세탁'], ['clean', '주방·청소'],
  ]},
];

const PRODUCTS = [
  // ───────── 영양 건강 · 뉴트리라이트 ─────────
  { n: '더블엑스', c: 'nutrition', h: '1일 2회 · 골드·실버·그린팩 각 2정 (또는 1포) · 식사 시 물과 함께', upd: 4, s: '멀티비타민', z: '골드·실버·그린팩 각 124정 (트레이)', p: 91000, pg: 33, t: ['basic','fatigue','antiox'], a: [19, 99], d: '뉴트리라이트 대표 종합 비타민·무기질', v: [{ z: '리필', p: 88000 }] },
  { n: '더블엑스 10데이즈', c: 'nutrition', h: '1일 2회 · 1회 1포 · 식사 시 물과 함께', upd: 2, s: '멀티비타민', z: '20포 (10일분)', p: 32000, pg: 33, t: ['basic','fatigue'], a: [19, 99], d: '더블엑스를 짧게 경험해 보는 소포장' },
  { n: '비긴', c: 'nutrition', h: '1일 1회 · 1포 · 물 50~100ml에 타서', upd: 1, s: '프로바이오틱스', z: '30포', p: 67000, pg: 49, t: ['gut','digest'], d: '장 환경 개선 + 유산균, 데일리 장 건강 스타터' },
  { n: '밸런스 위드인 더블유', c: 'nutrition', h: '1일 1회 · 1포 · 그대로 또는 찬물·찬 음료와 함께', upd: 1, s: '프로바이오틱스', z: '30포', p: 51000, pg: 35, t: ['gut'], g: 'F', d: '크랜베리·이눌린을 더한 여성용 유산균' },
  { n: '밸런스 위드인 이뮤니티', c: 'nutrition', h: '1일 1회 · 1캡슐 · 물과 함께', upd: 1, s: '프로바이오틱스', z: '30캡슐', p: 49000, pg: 36, t: ['gut','immune'], d: '100억 CFU 유산균 + 면역 기능에 필요한 아연' },
  { n: '밸런스 위드인 슬림핏', c: 'nutrition', h: '1일 1회 · 1캡슐 · 물과 함께', upd: 1, s: '프로바이오틱스', z: '30캡슐', p: 70000, pg: 36, t: ['gut','weight'], a: [19, 99], d: '체지방 감소 기능성 유산균 복합물' },
  { n: '엔자임 바이옴', c: 'nutrition', h: '1일 1회 · 1포 · 충분한 물과 함께', upd: 1, s: '효소', z: '30포', p: 43000, pg: 47, t: ['digest','gut'], d: '발효효소 + 단백질·글루텐 분해 특허 유산균', v: [{ z: '90포', p: 115000 }] },
  { n: '화이버 비츠 플러스', c: 'nutrition', h: '1일 2회 · 1회 17g · 씹어서', tpd: 2, s: '식이섬유', z: '24회분(408g)', p: 60000, pg: 49, t: ['gut','weight'], d: '황금 비율 식이섬유' },
  { n: '뉴트리 화이버 파우더', c: 'nutrition', h: '1일 1회 · 1포 · 물·음료 200~300ml에 녹여서 (탄산 제외)', upd: 1, s: '식이섬유', z: '30포', p: 37000, pg: 49, t: ['gut'], d: '물에 타 먹는 수용성 식이섬유' },
  { n: '비타민 비 플러스', c: 'nutrition', h: '1일 3회 · 1회 1정 · 식사 시 물과 함께', upd: 3, s: '비타민', z: '90정', p: 36000, pg: 40, t: ['fatigue','preg','growth'], d: '6중 기능성 비타민 B군 8종, 하루 활력 충전' },

const $ = s => document.querySelector(s);
const won = n => n.toLocaleString('ko-KR') + '원';
const LABEL = Object.fromEntries(CONCERNS.flatMap(g => g.items));
PRODUCTS.forEach((p, i) => p.id = i);

const state = { gender: null, cats: new Set(), concerns: new Set() };
// 선택 목록: key = `${id}|${variantIndex}` → qty
let picks = {};
try { picks = JSON.parse(localStorage.getItem('picks') || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem('picks', JSON.stringify(picks)); } catch (e) {} };

function variants(p) { return [{ z: p.z, p: p.p }, ...(p.v || [])]; }
function chosenVariant(p) {
  const k = Object.keys(picks).find(k => k.startsWith(p.id + '|'));
  return k ? +k.split('|')[1] : 0;
}

// ── 입력 UI 구성 ──
function chipToggle(el, set, v) { set.has(v) ? set.delete(v) : set.add(v); el.classList.toggle('on'); }
$('#cats').innerHTML = Object.entries(CATEGORIES).map(([k, c]) => `<span class="chip" data-v="${k}">${c.icon} ${c.label}</span>`).join('');
$('#cats').onclick = e => { const c = e.target.closest('.chip'); if (c) chipToggle(c, state.cats, c.dataset.v); };
$('#concerns').innerHTML = CONCERNS.map(g => `<div class="grp"><span class="grp-title">${g.group}</span><div class="chips">${
  g.items.map(([k, l]) => `<span class="chip" data-v="${k}">${l}</span>`).join('')}</div></div>`).join('');
$('#concerns').onclick = e => { const c = e.target.closest('.chip'); if (c) chipToggle(c, state.concerns, c.dataset.v); };
$('#gender').onclick = e => {
  const c = e.target.closest('.chip'); if (!c) return;
  state.gender = state.gender === c.dataset.v ? null : c.dataset.v;
  [...$('#gender').children].forEach(x => x.classList.toggle('on', x.dataset.v === state.gender));
};
$('#fCat').innerHTML += Object.entries(CATEGORIES).map(([k, c]) => `<option value="${k}">${c.icon} ${c.label}</option>`).join('');

// ── 카드 ──
// 1통으로 며칠 먹는지: 정·캡슐·포 개수 ÷ 하루 섭취량, 또는 회분 ÷ 하루 횟수
function daysOf(p, v) {
  let m = v.z.match(/(\d+)\s*회분/);
  if (m && p.tpd) return Math.floor(+m[1] / p.tpd);
  if (!p.upd) return null;
  m = v.z.match(/(\d+)\s*(정|캡슐|포|매|개)(?:\s*×\s*(\d+))?/);
  return m ? Math.floor(+m[1] * (+m[3] || 1) / p.upd) : null;
}
function daysText(p, v) {
  const d = daysOf(p, v);
  return d ? `1통 약 ${d}일분 · 하루 약 ${won(Math.round(v.p / d / 10) * 10)}` : '';
}
function doseBlock(p, v) {
  if (!p.h) return '';
  const dt = daysText(p, v);
  return `<div class="dose"><b>🕐 섭취 방법</b>${p.h}${dt ? `<span class="days">${dt}</span>` : ''}</div>`;
}

function card(p, why) {
  const vs = variants(p), vi = chosenVariant(p), sel = Object.keys(picks).some(k => k.startsWith(p.id + '|'));
  const cur = vs[vi];
  return `<div class="card ${sel ? 'sel' : ''}" data-id="${p.id}">
    <div class="meta"><span>${CATEGORIES[p.c].icon} ${p.s}</span><span>카탈로그 p.${p.pg}</span></div>
    <h3>${p.n}</h3>
    <p class="desc">${p.d}</p>
    ${why && why.length ? `<div class="why">${why.map(w => `<span>${w}</span>`).join('')}</div>` : ''}
    <div class="price">${won(cur.p)}<span class="size">${cur.z}</span></div>
    ${doseBlock(p, cur)}
    ${vs.length > 1 ? `<select class="vsel">${vs.map((v, i) => `<option value="${i}" ${i === vi ? 'selected' : ''}>${v.z} · ${won(v.p)}</option>`).join('')}</select>` : ''}
    ${p.m ? `<div class="monthly">${p.m}</div>` : ''}
    <button class="pick">${sel ? '✓ 선택됨' : '+ 선택'}</button>
  </div>`;
}

// ── 추천 ──
function recommend() {
  const age = parseInt($('#age').value, 10);
  const budget = +$('#budget').value || Infinity;
  const cs = state.concerns;
  if (!cs.size) {
    $('#recOut').innerHTML = `<div class="empty">고민·증상을 하나 이상 선택해 주세요.</div>`;
    return;
  }
  const res = [];
  for (const p of PRODUCTS) {
    if (state.cats.size && !state.cats.has(p.c)) continue;
    if (p.g && state.gender && p.g !== state.gender) continue;
    if (p.a && !isNaN(age) && (age < p.a[0] || age > p.a[1])) continue;
    if (p.p > budget) continue;
    const hit = p.t.filter(t => cs.has(t));
    if (!hit.length) continue;
    let score = hit.length * 10 - p.t.length; // 고민에 딱 맞는 전문 제품을 위로
    const why = hit.map(t => LABEL[t]);
    if (p.a && !isNaN(age)) { score += 3; why.push(age < 13 ? '어린이 적합' : age < 20 ? '청소년 적합' : `${Math.floor(age / 10) * 10}대 적합`); }
    if (p.g && state.gender) { score += 2; why.push(p.g === 'F' ? '여성용' : '남성용'); }
    res.push({ p, score, why });
  }
  res.sort((a, b) => b.score - a.score || a.p.p - b.p.p);

  // 카테고리별로 묶어서 보여주기
  const byCat = {};
  res.forEach(r => (byCat[r.p.c] ||= []).push(r));
  const parts = Object.keys(CATEGORIES).filter(k => byCat[k]).map(k => `
    <div class="result-head"><h2>${CATEGORIES[k].icon} ${CATEGORIES[k].label}</h2><span>${byCat[k].length}개</span></div>
    <div class="grid">${byCat[k].map(r => card(r.p, r.why)).join('')}</div>`);
  $('#recOut').innerHTML = parts.length ? parts.join('') :
    `<div class="empty">조건에 맞는 제품이 없어요. 예산이나 관심 분야를 넓혀 보세요.</div>`;
  $('#recOut').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
$('#go').onclick = recommend;
$('#reset').onclick = () => {
  state.gender = null; state.cats.clear(); state.concerns.clear();
  document.querySelectorAll('#viewRec .chip.on').forEach(c => c.classList.remove('on'));
  $('#age').value = ''; $('#budget').value = ''; $('#recOut').innerHTML = '';
};

// ── 전체 제품 ──
function renderAll() {
  const q = $('#q').value.trim().replace(/\s/g, ''), fc = $('#fCat').value, so = $('#fSort').value;
  let list = PRODUCTS.filter(p => (!fc || p.c === fc) && (!q || (p.n + p.s + p.d).replace(/\s/g, '').includes(q)));
  if (so === 'low') list = [...list].sort((a, b) => a.p - b.p);
  if (so === 'high') list = [...list].sort((a, b) => b.p - a.p);
  $('#allCount').textContent = `${list.length}개`;
  $('#allGrid').innerHTML = list.map(p => card(p)).join('') || `<div class="empty">검색 결과가 없어요.</div>`;
}
['#q', '#fCat', '#fSort'].forEach(s => $(s).addEventListener('input', renderAll));

// ── 탭 ──
function tab(name) {
  for (const t of ['Rec', 'All', 'Dose']) {
    $('#tab' + t).classList.toggle('on', t === name);
    $('#view' + t).hidden = t !== name;
  }
  if (name === 'All') renderAll();
  if (name === 'Dose') renderDose();
}
$('#tabRec').onclick = () => tab('Rec');
$('#tabAll').onclick = () => tab('All');
$('#tabDose').onclick = () => tab('Dose');

function renderDose() {
  const q = $('#dq').value.trim().replace(/\s/g, '');
  const list = PRODUCTS.filter(p => p.h && (!q || (p.n + p.s).replace(/\s/g, '').includes(q)));
  $('#doseCount').textContent = `${list.length}개`;
  $('#doseList').innerHTML = list.map(p => {
    const dts = variants(p).map(v => { const d = daysOf(p, v); return d ? `${v.z} → 약 ${d}일` : ''; }).filter(Boolean);
    return `<div class="dose-row"><div class="top"><b>${p.n}</b><span>p.${p.pg}</span></div>
      <div class="how">${p.h}</div>${dts.length ? `<div class="days">${dts.join(' · ')}</div>` : ''}</div>`;
  }).join('') || `<div class="empty">검색 결과가 없어요.</div>`;
}
$('#dq').addEventListener('input', renderDose);

// ── 선택 ──
document.addEventListener('click', e => {
  const btn = e.target.closest('.pick'); if (!btn) return;
  const id = +btn.closest('.card').dataset.id;
  const k = Object.keys(picks).find(k => k.startsWith(id + '|'));
  if (k) delete picks[k];
  else picks[`${id}|${chosenVariantFromCard(btn.closest('.card'))}`] = 1;
  afterChange();
});
document.addEventListener('change', e => {
  if (!e.target.classList.contains('vsel')) return;
  const cardEl = e.target.closest('.card'), id = +cardEl.dataset.id, vi = +e.target.value;
  const p = PRODUCTS[id], k = Object.keys(picks).find(k => k.startsWith(id + '|'));
  if (k) { const q = picks[k]; delete picks[k]; picks[`${id}|${vi}`] = q; }
  cardEl.querySelector('.price').innerHTML = `${won(variants(p)[vi].p)}<span class="size">${variants(p)[vi].z}</span>`;
  const dose = cardEl.querySelector('.dose');
  if (dose) dose.outerHTML = doseBlock(p, variants(p)[vi]);
  cardEl.dataset.vi = vi;
  afterChange(false);
});
function chosenVariantFromCard(el) { const s = el.querySelector('.vsel'); return s ? +s.value : 0; }

function afterChange(rerender = true) {
  save(); renderBar(); renderSheet();
  if (!rerender) return;
  document.querySelectorAll('.card').forEach(el => {
    const id = +el.dataset.id, sel = Object.keys(picks).some(k => k.startsWith(id + '|'));
    el.classList.toggle('sel', sel);
    el.querySelector('.pick').textContent = sel ? '✓ 선택됨' : '+ 선택';
  });
}
function pickLines() {
  return Object.entries(picks).map(([k, q]) => {
    const [id, vi] = k.split('|').map(Number), p = PRODUCTS[id];
    if (!p) return null;
    const v = variants(p)[vi] || variants(p)[0];
    return { k, p, v, q };
  }).filter(Boolean);
}
function renderBar() {
  const ls = pickLines();
  $('#barCount').textContent = ls.reduce((s, l) => s + l.q, 0);
  $('#barTotal').textContent = won(ls.reduce((s, l) => s + l.v.p * l.q, 0));
}
function renderSheet() {
  const ls = pickLines();
  $('#lines').innerHTML = ls.length ? ls.map(l => `<div class="line" data-k="${l.k}">
      <div class="nm">${l.p.n}<small>${l.v.z} · ${won(l.v.p)}</small>${l.p.h ? `<small>🕐 ${l.p.h}</small>` : ''}</div>
      <div class="qty"><button data-d="-1">−</button><span>${l.q}</span><button data-d="1">+</button></div>
      <div class="lp">${won(l.v.p * l.q)}</div></div>`).join('')
    : `<div class="empty">아직 선택한 제품이 없어요.</div>`;
  $('#sheetTotal').textContent = won(ls.reduce((s, l) => s + l.v.p * l.q, 0));
}
$('#lines').onclick = e => {
  const b = e.target.closest('button[data-d]'); if (!b) return;
  const k = b.closest('.line').dataset.k;
  picks[k] += +b.dataset.d;
  if (picks[k] <= 0) delete picks[k];
  afterChange();
};
const openSheet = v => { $('#sheet').classList.toggle('open', v); $('#sheetBg').style.display = v ? 'block' : 'none'; };
$('#openSheet').onclick = () => { renderSheet(); openSheet(true); };
$('#closeSheet').onclick = $('#sheetBg').onclick = () => openSheet(false);
$('#clearSel').onclick = () => { picks = {}; afterChange(); };
$('#copySel').onclick = async () => {
  const ls = pickLines(); if (!ls.length) return toast('선택한 제품이 없어요');
  const total = ls.reduce((s, l) => s + l.v.p * l.q, 0);
  const txt = ['[추천 제품 안내]', ...ls.map((l, i) =>
      `${i + 1}. ${l.p.n} (${l.v.z}) ${won(l.v.p)}${l.q > 1 ? ` × ${l.q}` : ''}${l.p.h ? `\n   섭취: ${l.p.h}` : ''}${daysOf(l.p, l.v) ? ` (1통 약 ${daysOf(l.p, l.v)}일분)` : ''}${l.p.m ? `\n   ${l.p.m}` : ''}`),
    `합계 ${won(total)}`, '※ 암웨이 카탈로그 Vol.75 기준, 가격은 변동될 수 있습니다.'].join('\n');
  try { await navigator.clipboard.writeText(txt); toast('복사했어요. 메시지에 붙여넣기 하세요'); }
  catch (e) { prompt('아래 내용을 복사하세요', txt); }
};
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }

renderBar();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
