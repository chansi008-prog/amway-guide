<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계산 규칙 테스트</title>
<style>
  body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; margin: 0; padding: 16px; background: #F3F5F4; color: #17201C; }
  h1 { font-size: 20px; }
  #sum { font-weight: 700; padding: 12px 14px; border-radius: 10px; margin-bottom: 12px; }
  #sum.ok { background: #E3EFEA; color: #1F6B52; } #sum.bad { background: #FBE9DF; color: #A1450F; }
  li { margin: 4px 0; font-size: 14px; } .f { color: #A1450F; font-weight: 700; }
</style>
</head>
<body>
<h1>계산 규칙 자동 테스트 (요청서 5장)</h1>
<div id="sum">실행 중…</div>
<ul id="out"></ul>
<script type="module">
import * as L from './js/logic.js';
import { DEFAULT_SETTINGS } from './js/store.js';

const results = [];
const eq = (name, got, want) => {
  const ok = JSON.stringify(got) === JSON.stringify(want);
  results.push({ name, ok, msg: ok ? '' : `결과 ${JSON.stringify(got)} / 기대 ${JSON.stringify(want)}` });
};
const W = 'p:이스프링 정수기 3중 필터 카트리지';
const base = () => ({
  settings: structuredClone(DEFAULT_SETTINGS),
  customers: [{ id: 'c1', name: '김지영', birthday: '', gender: 'F', birthYear: 1984 }],
  interests: [], purchases: [], devices: [], sops: [], intros: [], taskLogs: [], products: [], productEdits: [],
});
const withFilter = () => {
  const d = base();
  d.devices.push({ id: 'd1', customerId: 'c1', kind: '정수기', installedAt: '2024-10-01', filters: [{ productId: W }] });
  d.purchases.push({ id: 'p1', customerId: 'c1', productId: W, date: '2025-10-22', quantity: 1, deviceId: 'd1' });
  return d;
};
const types = (d, today) => L.buildTasks(d, today).map(t => t.type + ' ' + t.due);

// 날짜
eq('한 달 뒤 (말일 보정)', L.addMonths('2026-01-31', 1), '2026-02-28');
eq('이번 주 일요일 (화요일 기준)', L.endOfWeek('2026-10-20'), '2026-10-25');
eq('이번 주 일요일 (일요일 당일)', L.endOfWeek('2026-10-25'), '2026-10-25');

// 5.1 교체 예정일
const fc = L.allFilterCycles(withFilter(), '2026-10-20').filter(c => !c.repurchasedAt);
eq('교체 예정일 = 마지막 교체일 + 12개월', fc.map(c => c.due), ['2026-10-22']);
eq('구매 기록이 없으면 설치일 기준', (() => { const d = withFilter(); d.purchases = []; return L.allFilterCycles(d, '2026-10-20').map(c => c.due); })(), ['2025-10-01']);
eq('제품 관리에서 바꾼 교체 주기 반영', (() => { const d = withFilter(); d.productEdits = [{ id: W, months: 6 }]; return L.allFilterCycles(d, '2026-01-01').filter(c => !c.repurchasedAt).map(c => c.due); })(), ['2026-04-22']);

// 5.3 필터 할 일: 21일 전부터
eq('22일 전에는 할 일 없음', types(withFilter(), '2026-09-30'), []);
eq('21일 전부터 할 일 생김', types(withFilter(), '2026-10-01'), ['필터 교체 2026-10-22']);
eq('예정일 지나면 놓친 고객', types(withFilter(), '2026-10-25'), ['놓친 고객 2026-10-22']);
eq('알림 끈 기기는 할 일 없음', (() => { const d = withFilter(); d.devices[0].reminderOff = true; return types(d, '2026-10-20'); })(), []);

// 5.2 상태
const rebought = withFilter(); rebought.purchases.push({ id: 'p2', customerId: 'c1', productId: W, date: '2026-10-23', quantity: 1, deviceId: 'd1' });
eq('재구매하면 재구매 완료 + 다음 예정일 1년 뒤', L.allFilterCycles(rebought, '2026-10-25').filter(c => c.due >= '2026').map(c => [c.due, c.status]),
  [['2026-10-22', '재구매 완료'], ['2027-10-23', '아직 연락 안 함']]);
eq('재구매하면 할 일 자동 정리', types(rebought, '2026-10-25'), []);
const contacted = withFilter(); contacted.taskLogs.push({ taskKey: L.filterKey('d1', W, '2026-10-22'), status: '완료', doneAt: '2026-10-19T10:00:00' });
eq('처리 기록 있으면 연락함', L.allFilterCycles(contacted, '2026-10-20').filter(c => !c.repurchasedAt).map(c => c.status), ['연락함']);

// 5.4 오늘 / 이번 주
const tw = withFilter();
eq('예정일이 오늘+2일 이내면 오늘 목록', L.todayTasks(L.visibleTasks(tw, '2026-10-20'), '2026-10-20').length, 1);
eq('예정일이 오늘+3일이면 오늘 목록 아님', L.todayTasks(L.visibleTasks(tw, '2026-10-19'), '2026-10-19').length, 0);
eq('…하지만 이번 주 목록에는 있음', L.weekTasks(L.visibleTasks(tw, '2026-10-19'), '2026-10-19').length, 1);
eq('완료한 날에는 취소선으로 남음', L.visibleTasks(contacted, '2026-10-19').map(t => t.done), [true]);
eq('다음 날에는 사라짐', L.visibleTasks(contacted, '2026-10-20').length, 0);
const snoozed = withFilter(); snoozed.taskLogs.push({ taskKey: L.filterKey('d1', W, '2026-10-22'), status: '미룸', snoozeUntil: '2026-10-21' });
eq('미룬 날짜 전에는 숨김', L.visibleTasks(snoozed, '2026-10-20').length, 0);
eq('미룬 날짜가 되면 다시 보임', L.visibleTasks(snoozed, '2026-10-21').length, 1);
eq('일요일에도 이번 주 목록에 오늘 목록 포함', L.weekEnd('2026-10-25'), '2026-10-27');
eq('정렬: 기한 지난 것 먼저', (() => {
  const d = withFilter(); d.customers[0].birthday = '10-24'; d.sops.push({ id: 's1', customerId: 'c1', type: '장바구니 SOP', startDate: '2026-01-01', cycle: '매월', payDay: 21, status: '이용 중' });
  return L.visibleTasks(d, '2026-10-23').map(t => t.type);
})(), ['놓친 고객', '생일']);

// SOP
eq('SOP 다음 결제일 (매월)', L.nextPayDate({ status: '이용 중', startDate: '2026-01-05', cycle: '매월', payDay: 23 }, '2026-10-20'), '2026-10-23');
eq('SOP 다음 결제일 (격월)', L.nextPayDate({ status: '이용 중', startDate: '2026-01-05', cycle: '격월', payDay: 5 }, '2026-10-20'), '2026-11-05');
eq('SOP 31일 결제는 말일로', L.nextPayDate({ status: '이용 중', startDate: '2026-01-01', cycle: '매월', payDay: 31 }, '2026-11-02'), '2026-11-30');
eq('일시중지 SOP는 결제일 없음', L.nextPayDate({ status: '일시중지', startDate: '2026-01-05', cycle: '매월', payDay: 23 }, '2026-10-20'), null);
const sopD = () => { const d = base(); d.customers[0].birthday = ''; d.sops.push({ id: 's1', customerId: 'c1', type: '일반 SOP', item: '영양제', startDate: '2026-01-05', cycle: '매월', payDay: 23, status: '이용 중' }); return d; };
eq('SOP 결제 할 일은 3일 전부터', [types(sopD(), '2026-10-19'), types(sopD(), '2026-10-20')], [[], ['SOP 결제 2026-10-23']]);
eq('SOP 이름 표시', L.sopName({ type: '일반 SOP', item: '영양제' }), '일반 SOP · 영양제');
eq('해지 30일 뒤 근황 연락', (() => { const d = base(); d.customers[0].birthday = ''; d.sops.push({ id: 's2', customerId: 'c1', type: '일반 SOP', item: '화장품', status: '해지', endedAt: '2026-09-20' }); return [types(d, '2026-10-19'), types(d, '2026-10-20')]; })(), [[], ['SOP 해지 2026-10-20']]);

// 소개 후속
const introD = () => { const d = base(); d.customers[0].birthday = ''; d.intros.push({ id: 'n1', customerId: 'c1', productId: 'p:이뮤니티 에키네시아', date: '2026-10-12', method: '샘플', reaction: '미확인' }); return d; };
eq('소개 7일 뒤 반응 확인', [types(introD(), '2026-10-18'), types(introD(), '2026-10-19')], [[], ['소개 후속 2026-10-19']]);
eq('반응을 기록하면 후속 할 일 없음', (() => { const d = introD(); d.intros[0].reaction = '관심 있음'; return types(d, '2026-10-20'); })(), []);
const introBought = introD(); introBought.purchases.push({ id: 'p9', customerId: 'c1', productId: 'p:이뮤니티 에키네시아', date: '2026-10-15', quantity: 1 });
eq('소개 후 구매하면 구매로 이어짐', L.introPurchased(introBought, introBought.intros[0]), true);
eq('구매로 이어지면 후속 할 일 없음', types(introBought, '2026-10-20'), []);

// 생일
const bd = () => { const d = base(); d.customers[0].birthday = '10-24'; return d; };
eq('생일이 이번 주면 할 일', types(bd(), '2026-10-20'), ['생일 2026-10-24']);
eq('생일이 다음 주면 아직 없음', types(bd(), '2026-10-18'), []);

// 영양제 재구매
const refill = () => { const d = base(); d.customers[0].birthday = ''; d.purchases.push({ id: 'r1', customerId: 'c1', productId: 'p:비타민 비 플러스', date: '2026-09-25', quantity: 1 }); return d; };
eq('영양제 다 드실 때 7일 전 알림 (90정 ÷ 하루 3정 = 30일)', types(refill(), '2026-10-18'), ['재구매 2026-10-25']);
eq('SOP로 받는 구매는 재구매 알림 없음', (() => { const d = refill(); d.purchases[0].viaSop = true; return types(d, '2026-10-18'); })(), []);

// 5.5 추천
const reco = () => { const d = base(); d.interests.push({ id: 'i1', customerId: 'c1', rank: 1, category: '면역' }); return d; };
const r1 = L.recommendFor(reco(), reco().customers[0], '2026-10-20').map(x => x.product.id);
eq('관심 항목에 맞는 제품 추천', r1.length > 0, true);
const bought = reco(); bought.purchases.push({ id: 'b1', customerId: 'c1', productId: r1[0], date: '2026-10-01', quantity: 1 });
eq('이미 산 제품은 추천에서 빠짐', L.recommendFor(bought, bought.customers[0], '2026-10-20').some(x => x.product.id === r1[0]), false);
eq('관련 제품 안 산 소비자', L.customersByInterest(reco(), '면역', true).length, 1);
eq('관련 제품 산 소비자는 빠짐', L.customersByInterest(bought, '면역', true).length, 0);
const ri = reco(); ri.intros.push({ id: 'n2', customerId: 'c1', productId: r1[0], date: '2026-10-05', method: '샘플', reaction: '보류' });
eq('최근 30일 안에 소개한 제품 표시', L.recommendFor(ri, ri.customers[0], '2026-10-20').find(x => x.product.id === r1[0])?.recentlyIntroduced, true);
eq('남성 전용 제품은 여성에게 추천 안 함', (() => { const d = base(); d.interests.push({ id: 'i2', customerId: 'c1', rank: 1, category: '전립선' }); return L.recommendFor(d, d.customers[0], '2026-10-20').length; })(), 0);

eq('아이 건강은 본인 나이와 상관없이 어린이 제품 추천', (() => { const d = base(); d.interests.push({ id: 'i3', customerId: 'c1', rank: 1, category: '아이 건강' }); return L.recommendFor(d, d.customers[0], '2026-10-20').some(x => x.product.a && x.product.a[1] <= 18); })(), true);

// 영양제 섭취 기간
eq('1통 기간: 비타민 비 플러스 90정', L.daysOf({ upd: 3, z: '90정' }), 30);
eq('1통 기간: 번들 30정×3', L.daysOf({ upd: 1, z: '30정×3 번들' }), 90);
eq('1통 기간: 회분 표기', L.daysOf({ tpd: 2, z: '약 36회분(450g)' }), 18);

const fail = results.filter(r => !r.ok);
const sum = document.getElementById('sum');
sum.textContent = fail.length ? `${results.length}개 중 ${fail.length}개 실패` : `${results.length}개 모두 통과`;
sum.className = fail.length ? 'bad' : 'ok';
document.title = sum.textContent;
document.getElementById('out').innerHTML = results.map(r => `<li class="${r.ok ? '' : 'f'}">${r.ok ? '✓' : '✗'} ${r.name}${r.msg ? ' — ' + r.msg : ''}</li>`).join('');
window.TEST_RESULTS = results;
</script>
</body>
</html>
